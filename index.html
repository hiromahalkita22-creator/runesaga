<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>ルーン・サーガ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05050c;color:#cfd3ff;font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
#wrap{position:relative;width:min(100%,calc((100vh - 60px)*512/448))}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#000;border-radius:6px;box-shadow:0 0 0 3px #1c1c3a,0 10px 40px #000a}
#help{font-size:13px;color:#8a90c8;text-align:center;line-height:1.6}
#nameBox{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:#12129a;border:3px solid #fff;border-radius:8px;padding:18px 24px;text-align:center;display:none;z-index:5;color:#fff;font-size:18px}
#nameBox small{color:#aab}
#nameBox input{font:inherit;font-size:22px;width:8em;text-align:center;background:#000;color:#fff;border:2px solid #fff;padding:6px;margin:12px 0;border-radius:4px;display:block}
#nameBox button{font:inherit;font-size:17px;background:#fff;color:#12129a;border:0;padding:6px 22px;border-radius:4px;cursor:pointer}
#game{display:grid;grid-template-areas:"screen";justify-items:center;align-items:center;gap:10px;width:100%}
#wrap{grid-area:screen}
.pad{display:none}
@media (pointer:coarse){
  html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
  body{justify-content:flex-start;padding:max(6px,env(safe-area-inset-top)) 6px 6px}
  #help{display:none}
  #game{grid-template-areas:"screen screen" "padL padR";grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;row-gap:18px;min-height:calc(100svh - 16px)}
  #padL,#padR{align-self:center}
  #wrap{width:min(100%,calc((100svh - 250px)*512/448))}
  .pad{display:flex;align-items:center;touch-action:none;-webkit-tap-highlight-color:transparent}
  #padL{grid-area:padL;justify-self:start;margin-left:6px;position:relative;width:168px;height:168px}
  #padL i{position:absolute;width:56px;height:56px;background:#2a2a60;border:2px solid #6a6ac0;display:flex;align-items:center;justify-content:center;color:#cfd3ff;font-style:normal;font-size:20px}
  #padL .up{left:56px;top:0;border-radius:10px 10px 0 0}
  #padL .down{left:56px;top:112px;border-radius:0 0 10px 10px}
  #padL .left{left:0;top:56px;border-radius:10px 0 0 10px}
  #padL .right{left:112px;top:56px;border-radius:0 10px 10px 0}
  #padL .mid{left:56px;top:56px;border-color:#2a2a60}
  #padL[data-dir=up] .up,#padL[data-dir=down] .down,#padL[data-dir=left] .left,#padL[data-dir=right] .right{background:#5a5ab8}
  #padR{grid-area:padR;justify-self:end;margin-right:8px;gap:16px;position:relative;height:168px}
  .ab{width:76px;height:76px;border-radius:50%;border:3px solid #fff;color:#fff;font:inherit;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;touch-action:none}
  .ab small{font-size:11px}
  .ab.a{background:#c0263a;margin-bottom:46px}
  .ab.b{background:#2a5ad0;margin-top:46px}
  .ab.on{filter:brightness(1.5)}
  .mute{position:absolute;right:0;top:-6px;background:#1c1c3a;border:1px solid #6a6ac0;color:#cfd3ff;border-radius:14px;font:inherit;font-size:13px;padding:4px 10px}

    body{padding:4px max(6px,env(safe-area-inset-left))}
    #game{grid-template-areas:"padL screen padR";grid-template-columns:auto 1fr auto;grid-template-rows:1fr;height:calc(100svh - 8px);min-height:0}
    #wrap{width:min(100%,calc((100svh - 12px)*512/448))}

</style>

<body>
<div id="game">
<div id="wrap">
  <canvas id="c" width="512" height="448"></canvas>
  <div id="nameBox">ゆうしゃの なまえを いれてください<br><small>(5もじ まで)</small>
    <input id="nameIn" maxlength="5" value="ゆうしゃ" autocomplete="off">

<div id="padL" class="pad"><i class="up">▲</i><i class="left">◀</i><i class="mid"></i><i class="right">▶</i><i class="down">▼</i></div>
<div id="padR" class="pad"><button class="mute" data-a="mute">♪ おと</button><button class="ab b" data-a="cancel">B<small>もどる</small></button><button class="ab a" data-a="ok">A<small>けってい</small></button></div>

<script>
(()=>{
'use strict';
const TS=32,CW=512,CH=448,MOVE_MS=150,SAVE_KEY='runesaga_save_v1';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"DotGothic16","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif';
const F=s=>s+'px '+FONT;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
function weighted(list){let s=0;for(const o of list)s+=o.w;let r=Math.random()*s;for(const o of list){r-=o.w;if(r<0)return o;}return list[list.length-1];}

/* ================= おと ================= */
let AC=null,master=null,bgmGain=null,sfxGain=null,muted=false;
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function freq(n){const m=/^([A-G])([#b]?)(\d)$/.exec(n);if(!m)return 0;const s=SEMI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12;return 440*Math.pow(2,(s-69)/12);}
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);
    bgmGain=AC.createGain();bgmGain.gain.value=.5;bgmGain.connect(master);
    sfxGain=AC.createGain();sfxGain.gain.value=.7;sfxGain.connect(master);
    const n=bgm.name;bgm.name=null;if(n)playBGM(n);
  }catch(e){AC=null;}
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.5;ui.banner={t:muted?'おんがく OFF':'おんがく ON',until:performance.now()+1200};}
function tone(f,t,d,type,v,dest){
  if(!AC||!f)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v||.1,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.04,d));
  o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+d+.06);
}
let noiseBuf=null;
function noise(t,d,v){
  if(!AC)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=noiseBuf;
  g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(g);g.connect(sfxGain);s.start(t);s.stop(t+d+.02);
}
function arp(notes,step,type,v){const t=AC.currentTime+.01;notes.forEach((n,i)=>{if(n!=='.')tone(freq(n),t+i*step,step*1.5,type,v);});}
function sfx(n){
  if(!AC||muted)return;const t=AC.currentTime+.005;
  switch(n){
    case 'cur':tone(1320,t,.03,'square',.03);break;
    case 'ok':tone(988,t,.04,'square',.05);tone(1319,t+.04,.05,'square',.05);break;
    case 'cancel':tone(660,t,.05,'square',.05);tone(440,t+.05,.06,'square',.04);break;
    case 'hit':noise(t,.14,.35);tone(140,t,.12,'square',.12);break;
    case 'crit':noise(t,.25,.45);tone(220,t,.08,'sawtooth',.15);tone(110,t+.08,.18,'square',.15);break;
    case 'hurt':noise(t,.2,.4);tone(90,t,.2,'sawtooth',.15);break;
    case 'miss':tone(500,t,.05,'triangle',.08);tone(300,t+.05,.08,'triangle',.08);break;
    case 'magic':for(let i=0;i<8;i++)tone(400+i*120,t+i*.03,.06,'square',.05);break;
    case 'fire':noise(t,.5,.3);for(let i=0;i<6;i++)tone(200-i*20,t+i*.05,.08,'sawtooth',.06);break;
    case 'ice':for(let i=0;i<10;i++)tone(1800+rnd(-300,300),t+i*.04,.05,'triangle',.05);break;
    case 'bolt':noise(t,.35,.5);tone(60,t,.3,'square',.2);break;
    case 'heal':arp(['C5','E5','G5','C6'],.06,'triangle',.1);break;
    case 'enc':for(let i=0;i<10;i++)tone(1200-i*90,t+i*.035,.05,'square',.06);break;
    case 'run':for(let i=0;i<6;i++)tone(300+i*100,t+i*.04,.05,'square',.05);break;
    case 'die':for(let i=0;i<6;i++)tone(400-i*50,t+i*.07,.1,'square',.07);break;
    case 'kill':noise(t,.3,.25);for(let i=0;i<5;i++)tone(900-i*150,t+i*.04,.06,'square',.05);break;
    case 'door':tone(220,t,.08,'square',.06);tone(330,t+.08,.1,'square',.06);break;
    case 'chest':arp(['G4','C5','E5','G5','C6'],.07,'square',.06);break;
    case 'lvup':arp(['C5','C5','C5','.','G5','.','C6'],.09,'square',.08);break;
    case 'win':arp(['G4','G4','G4','.','E4','.','G4','.','C5','C5'],.1,'square',.07);break;
    case 'inn':arp(['C5','E5','G5','E5','C5','.','G4','C5'],.16,'triangle',.1);break;
    case 'buy':tone(1568,t,.05,'square',.05);tone(2093,t+.06,.08,'square',.05);break;
    case 'no':tone(200,t,.12,'square',.07);break;
  }
}
const SONGS={

    bass:"C3 . G3 . C3 . G3 . | A2 . E3 . A2 . E3 . | F2 . C3 . F2 . C3 . | G2 . D3 . G2 . D3 . | A2 . E3 . A2 . E3 . | C3 . G3 . C3 . G3 . | F2 . C3 . F2 . C3 . | G2 . D3 . G2 . D3 ."},

    bass:"C3 . G3 . E3 . G3 . | G2 . D3 . B2 . D3 . | F2 . C3 . A2 . C3 . | C3 . G3 . E3 . G3 . | C3 . G3 . E3 . G3 . | G2 . D3 . B2 . D3 . | A2 . E3 . F2 . C3 . | C3 . G3 . C3 . . ."},
  castle:{tempo:88,
    lead:"C5 - - G4 A4 - - E4 | F4 - A4 - G4 - - - | E4 - G4 - C5 - - - | D5 - B4 - G4 - - - | C5 - - G4 A4 - - E4 | F4 - A4 - G4 - E4 - | F4 - D4 - G4 - B4 - | C5 - - - . - - -",
    bass:"C3 - G3 - C3 - G3 - | F2 - C3 - F2 - C3 - | C3 - G3 - C3 - G3 - | G2 - D3 - G2 - D3 - | C3 - G3 - C3 - G3 - | F2 - C3 - F2 - C3 - | G2 - D3 - G2 - D3 - | C3 - G3 - C3 - - -"},
  battle:{tempo:168,
    lead:"A4 C5 E5 C5 A4 C5 E5 C5 | G4 B4 D5 B4 G4 B4 D5 B4 | F4 A4 C5 A4 F4 A4 C5 A4 | E4 G#4 B4 G#4 E5 D5 B4 G#4 | E5 - E5 D5 C5 - A4 - | D5 - D5 C5 B4 - G4 - | C5 - C5 B4 A4 - F4 - | B4 - G#4 - E4 - . -",
    bass:"A2 A2 A3 A2 A2 A2 A3 A2 | G2 G2 G3 G2 G2 G2 G3 G2 | F2 F2 F3 F2 F2 F2 F3 F2 | E2 E2 E3 E2 E2 E2 E3 E2 | A2 A2 A3 A2 A2 A2 A3 A2 | G2 G2 G3 G2 G2 G2 G3 G2 | F2 F2 F3 F2 F2 F2 F3 F2 | E2 E2 E3 E2 E2 E2 E3 E2"},

    lead:"A3 - - - E4 - - - | F4 - - - E4 - - - | D4 - - - C4 - B3 - | A3 - - - . - - - | C4 - - - G4 - - - | F4 - - - E4 - D#4 - | E4 - - - B3 - - - | E4 - - - . - - -",
    bass:"A2 - - - - - - - | F2 - - - - - - - | D2 - - - - - - - | A2 - - - - - - - | C3 - - - - - - - | D2 - - - - - - - | E2 - - - - - - - | E2 - - - - - - -"},
  boss:{tempo:176,
    lead:"A4 A4 . A4 C5 . B4 . | A4 A4 . A4 E5 . D5 . | F4 F4 . F4 A4 . G4 . | E4 E4 . E4 G#4 . B4 . | A5 - G5 - F5 - E5 - | D5 - C5 - B4 - A4 - | F5 - E5 - D5 - C5 - | B4 - G#4 - E4 - . -",
    bass:"A2 A2 A3 A2 A2 A2 A3 A2 | A2 A2 A3 A2 A2 A2 A3 A2 | F2 F2 F3 F2 F2 F2 F3 F2 | E2 E2 E3 E2 E2 E2 E3 E2 | A2 A2 A3 A2 A2 A2 A3 A2 | D2 D2 D3 D2 D2 D2 D3 D2 | F2 F2 F3 F2 F2 F2 F3 F2 | E2 E2 E3 E2 E2 E2 E3 E2"},
  title:{tempo:100,
    lead:"C5 - - - G4 - C5 - | E5 - - - D5 - C5 - | D5 - - - G4 - B4 - | D5 - - - . - - - | E5 - - - C5 - E5 - | G5 - - - F5 - E5 - | D5 - - - G4 - B4 - | C5 - - - . - - -",
    bass:"C3 - G3 - C3 - G3 - | A2 - E3 - A2 - E3 - | G2 - D3 - G2 - D3 - | G2 - D3 - G2 - D3 - | C3 - G3 - C3 - G3 - | F2 - C3 - F2 - C3 - | G2 - D3 - G2 - D3 - | C3 - G3 - C3 - - -"}
};
const bgm={name:null,timer:null,t:0,step:0,N:0,L:[],B:[],dur:.2};
function parseTrack(s){
  const toks=s.replace(/\|/g,' ').trim().split(/\s+/);const ev=new Array(toks.length).fill(null);let last=-1;
  toks.forEach((t,i)=>{if(t==='-'){if(last>=0)ev[last].len++;}else if(t==='.'){last=-1;}else{ev[i]={f:freq(t),len:1};last=i;}});
  return ev;
}
function stopBGM(){if(bgm.timer)clearInterval(bgm.timer);bgm.timer=null;bgm.name=null;}
function playBGM(name){
  if(bgm.name===name&&bgm.timer)return;
  if(bgm.timer)clearInterval(bgm.timer);bgm.timer=null;bgm.name=name;
  if(!AC||!name)return;
  const s=SONGS[name];bgm.L=parseTrack(s.lead);bgm.B=parseTrack(s.bass);bgm.N=Math.max(bgm.L.length,bgm.B.length);
  bgm.dur=60/s.tempo/2;bgm.t=AC.currentTime+.08;bgm.step=0;bgm.timer=setInterval(tickBGM,40);
}
function tickBGM(){
  if(!AC)return;
  if(bgm.t<AC.currentTime-.5)bgm.t=AC.currentTime+.05;
  while(bgm.t<AC.currentTime+.2){
    const i=bgm.step,l=bgm.L[i],b=bgm.B[i];
    if(l)tone(l.f,bgm.t,bgm.dur*l.len*.92,'square',.055,bgmGain);
    if(b)tone(b.f,bgm.t,bgm.dur*b.len*.92,'triangle',.16,bgmGain);
    bgm.t+=bgm.dur;bgm.step=(i+1)%bgm.N;
  }
}

const bstat=(m,k)=>Math.floor(CLASSES[m.cls][k][0]+CLASSES[m.cls][k][1]*(m.lv-1));
function recalc(m){m.maxhp=bstat(m,'hp');m.maxmp=bstat(m,'mp');}
const atkOf=m=>bstat(m,'atk')+EQUIP[m.weapon].v;
const defOf=m=>bstat(m,'def')+EQUIP[m.armor].v;
const agiOf=m=>bstat(m,'agi');
const spellsOf=m=>CLASSES[m.cls].spells.filter(id=>SPELLS[id].lv<=m.lv);
const canEquip=(m,id)=>CAN[m.cls].includes(EQUIP[id].for);
const nameOf=id=>(ITEMS[id]||EQUIP[id]).n;
const priceOf=id=>(ITEMS[id]||EQUIP[id]).price;
function newMember(id,name,cls,lv){
  const m={id,name,cls,lv:lv||1,exp:EXP[lv||1]||0,weapon:START_GEAR[cls][0],armor:START_GEAR[cls][1],fl:0};
  recalc(m);m.hp=m.maxhp;m.mp=m.maxmp;return m;
}
function gainExp(m,exp){
  m.exp+=exp;const ups=[];
  while(m.lv<20&&m.exp>=EXP[m.lv+1]){
    const o={hp:m.maxhp,mp:m.maxmp,atk:bstat(m,'atk'),def:bstat(m,'def'),agi:bstat(m,'agi')};
    const before=spellsOf(m);
    m.lv++;recalc(m);
    m.hp+=m.maxhp-o.hp;m.mp+=m.maxmp-o.mp;
    const d=[`HP+${m.maxhp-o.hp}`];
    if(m.maxmp>o.mp)d.push(`MP+${m.maxmp-o.mp}`);
    d.push(`ちから+${bstat(m,'atk')-o.atk}`,`まもり+${bstat(m,'def')-o.def}`,`すばやさ+${bstat(m,'agi')-o.agi}`);
    ups.push({lv:m.lv,line:d.join(' '),learn:spellsOf(m).filter(s=>!before.includes(s))});
  }
  return ups;
}

const FEAT={V:{map:'village',x:18,y:22},C:{map:'castle',x:23,y:20},P:{map:'port',x:6,y:18},H:{map:'shrine',x:33,y:13},W:{map:'tower1',x:20,y:5}};
function genWorld(){
  const W=40,H=30;
  const hash=(x,y)=>{const h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);};
  const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,s=t=>t*t*(3-2*t);
    return lerp(lerp(hash(xi,yi),hash(xi+1,yi),s(xf)),lerp(hash(xi,yi+1),hash(xi+1,yi+1),s(xf)),s(yf));};
  const g=[];
  for(let y=0;y<H;y++){const row=[];for(let x=0;x<W;x++){
    const d=Math.hypot((x-20)/18,(y-16)/13.5);
    const n=vn(x*.22,y*.22)*.6+vn(x*.5+7,y*.5+3)*.4;
    let c='~';
    if(d+(.5-n)*.45<.93){
      c='.';
      const m=vn(x*.3+50,y*.3+20),f=vn(x*.33+11,y*.33+80),l=vn(x*.4+90,y*.4+5);
      if(m>.7||(y<11&&m>.5))c='^';
      else if(l>.8)c='~';
      else if(f>.58)c='T';
    }
    row.push(c);}g.push(row);}
  for(const f of Object.values(FEAT))
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const c=g[f.y+dy][f.x+dx];if(c==='~'||c==='^')g[f.y+dy][f.x+dx]='.';}
  const V=FEAT.V;let k=0;
  for(const ch of 'CPHW'){
    const f=FEAT[ch];let x=V.x,y=V.y+1,step=0;
    while((x!==f.x||y!==f.y+1)&&step<500){
      step++;k++;
      const dx=f.x-x,dy=(f.y+1)-y,r=hash(k,ch.charCodeAt(0));
      if(dx!==0&&(dy===0||r<Math.abs(dx)/(Math.abs(dx)+Math.abs(dy))))x+=Math.sign(dx);else y+=Math.sign(dy);
      if(g[y][x]==='~'||g[y][x]==='^')g[y][x]='.';
    }
  }
  for(const [ch,f] of Object.entries(FEAT))g[f.y][f.x]=ch;
  return g.map(r=>r.join(''));
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function win(x,y,w,h){
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#1b1ba8');g.addColorStop(1,'#0a0a58');
  rr(ctx,x,y,w,h,8);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
  rr(ctx,x+5,y+5,w-10,h-10,5);ctx.lineWidth=1;ctx.strokeStyle='#7a7aee';ctx.stroke();
}
function txt(s,x,y,col,size,al){ctx.font=F(size||20);ctx.textAlign=al||'left';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function tw(s,size){ctx.font=F(size||20);return ctx.measureText(s).width;}
function wrapLines(text,maxW){
  ctx.font=F(20);const out=[];
  for(const para of String(text).split('\n')){
    let line='';
    for(const w of para.split(' ')){
      const cand=line?line+' '+w:w;
      if(ctx.measureText(cand).width<=maxW){line=cand;continue;}
      if(line)out.push(line);line=w;
      while(ctx.measureText(line).width>maxW){let i=line.length;while(i>1&&ctx.measureText(line.slice(0,i)).width>maxW)i--;out.push(line.slice(0,i));line=line.slice(i);}
    }
    out.push(line);
  }
  return out;
}

let waiter=null,fieldAction=null;const held=[];
function onAction(a){
  if(a==='cancel'&&G.battle&&G.battle.auto){G.battle.auto=false;sfx('cancel');return;}
  if(ui.typing&&(a==='ok'||a==='cancel')){ui.typing.l.n=1e9;return;}
  if(waiter){if(!waiter.filter||waiter.filter.includes(a)){const w=waiter;waiter=null;w.res(a);}return;}
  if(a==='ok'||a==='cancel')fieldAction=a;
}
function waitAction(filter){return new Promise(res=>{waiter={filter,res};});}
function pauseOrKey(ms){
  return new Promise(res=>{
    let done=false;
    const w={filter:['ok','cancel'],res:()=>{if(done)return;done=true;clearTimeout(tm);res();}};
    const tm=setTimeout(()=>{if(done)return;done=true;if(waiter===w)waiter=null;res();},ms);
    waiter=w;
  });
}
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Enter:'ok',NumpadEnter:'ok',Space:'ok',KeyZ:'ok',Escape:'cancel',KeyX:'cancel',Backspace:'cancel'};

});

(()=>{
  const pad=document.getElementById('padL');let dir=null,rep=null,repT=null;
  const setDir=d=>{
    if(d===dir)return;
    if(dir){const i=held.indexOf(dir);if(i>=0)held.splice(i,1);}
    clearTimeout(repT);clearInterval(rep);dir=d;pad.dataset.dir=d||'';
    if(d){held.push(d);onAction(d);repT=setTimeout(()=>{rep=setInterval(()=>{if(dir)onAction(dir);},140);},420);}
  };
  const fromPoint=e=>{
    const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    if(Math.hypot(dx,dy)<14)return dir;

  };
  pad.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{pad.setPointerCapture(e.pointerId);}catch(_){}setDir(fromPoint(e));});
  pad.addEventListener('pointermove',e=>{if(dir!==null||e.buttons)setDir(fromPoint(e));});

function typeLast(){
  return new Promise(res=>{const l=ui.msg.lines[ui.msg.lines.length-1];if(!l.t.length){res();return;}ui.typing={l,res};});
}
function tickTyping(dt){const T=ui.typing;if(!T)return;T.l.n+=dt/24;if(T.l.n>=T.l.t.length){T.l.n=T.l.t.length;ui.typing=null;T.res();}}
async function say(text,opt){
  opt=opt||{};const M=ui.msg;M.on=true;
  const lines=wrapLines(text,440);
  if(opt.append){
    for(const ln of lines){M.lines.push({t:ln,n:0});while(M.lines.length>3)M.lines.shift();await typeLast();}
    await pauseOrKey(opt.wait!=null?opt.wait:600);return;
  }
  for(let i=0;i<lines.length;i+=3){
    M.lines=[];
    for(const ln of lines.slice(i,i+3)){M.lines.push({t:ln,n:0});await typeLast();}
    M.wait=true;await waitAction(['ok','cancel']);M.wait=false;
  }
}

async function choose(o){
  const m=Object.assign({cursor:0,top:0,cancel:true},o);ui.menus.push(m);
  if(m.onMove)m.onMove(m.cursor);
  try{
    for(;;){
      const a=await waitAction();const n=m.items.length;
      if(a==='up'){m.cursor=(m.cursor+n-1)%n;sfx('cur');m.onMove&&m.onMove(m.cursor);}
      else if(a==='down'){m.cursor=(m.cursor+1)%n;sfx('cur');m.onMove&&m.onMove(m.cursor);}
      else if(a==='ok'){sfx('ok');return m.cursor;}
      else if(a==='cancel'&&m.cancel){sfx('cancel');return -1;}
    }
  }finally{const i=ui.menus.indexOf(m);if(i>=0)ui.menus.splice(i,1);}
}

  const hills=(col,base,amp,seed)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,CH);for(let x=0;x<=CW;x+=8)g.lineTo(x,base-Math.abs(Math.sin(x*.012+seed))*amp-Math.sin(x*.05+seed)*6);g.lineTo(CW,CH);g.closePath();g.fill();};
  if(k==='plain'){
    g.fillStyle=lg(0,250,'#3d92e0','#cdeeff');g.fillRect(0,0,CW,CH);

/* ================= フィールド ================= */
function tileAt(x,y){const m=G.map;if(x<0||y<0||x>=m.w||y>=m.h)return null;return m.g[y][x];}
function solid(ch){if(ch==null)return true;return G.map.world?'~^'.includes(ch):'#=BKOYT~'.includes(ch);}
const visibleNpcs=()=>G.npcs.filter(n=>!(n.hide&&n.hide()));
function npcAt(x,y){return visibleNpcs().find(n=>n.x===x&&n.y===y);}
function chestAt(x,y){return (G.map.chests||[]).find(c=>c.x===x&&c.y===y);}
function passable(x,y){return !solid(tileAt(x,y))&&!npcAt(x,y)&&!chestAt(x,y);}
function resetFollowers(){G.fol=[0,1].map(()=>({x:G.x,y:G.y,px:G.x,py:G.y,dir:G.dir}));}
function enterMap(id,x,y,dir){
  const m=MAPS[id];G.map=m;G.mapId=id;G.x=G.px=x;G.y=G.py=y;G.mt=1;G.moving=false;G.dir=dir||'down';
  G.npcs=(m.npcs||[]).map(n=>Object.assign({},n,{hx:n.x,hy:n.y,px:n.x,py:n.y,mt:1,cd:rnd(500,2500),dir:n.dir||'down'}));
  resetFollowers();G.scene='field';G.encCool=3;playBGM(m.bgm);
  if(m.name)ui.banner={t:m.name,until:performance.now()+1800};
}
function tryMove(d){
  G.dir=d;const [dx,dy]=DIRS[d],nx=G.x+dx,ny=G.y+dy;
  if(!passable(nx,ny))return;
  const f=G.fol;
  f[1].px=f[1].x;f[1].py=f[1].y;f[1].x=f[0].x;f[1].y=f[0].y;
  f[0].px=f[0].x;f[0].py=f[0].y;f[0].x=G.x;f[0].y=G.y;
  for(const k of f){const ddx=k.x-k.px,ddy=k.y-k.py;if(ddx||ddy)k.dir=ddx>0?'right':ddx<0?'left':ddy>0?'down':'up';}
  G.px=G.x;G.py=G.y;G.x=nx;G.y=ny;G.mt=0;G.moving=true;
}
function busyRun(fn){
  G.busy=true;
  return (async()=>{
    try{await fn();}catch(e){console.error(e);}
    finally{closeMsg();ui.menus.length=0;ui.party=false;ui.gold=false;ui.page=null;G.busy=false;}
  })();
}
function zoneAt(x,y){const d=Math.hypot(x-FEAT.V.x,y-FEAT.V.y);return d<7.5?0:d<14?1:2;}
function arrive(){
  const m=G.map,ch=tileAt(G.x,G.y);
  if(m.world){if(FEAT[ch]){busyRun(()=>enterFeature(ch));return;}}
  else{
    if(ch==='E'){busyRun(leaveMap);return;}
    if(ch==='S'&&m.links){const l=m.links[G.x+','+G.y];if(l){busyRun(async()=>{sfx('door');await fade(1,250);enterMap(l.to,l.x,l.y,l.dir);await fade(0,250);});return;}}
    if(m.id==='tower2'&&!G.flags.boss&&G.y<=4){busyRun(bossEvent);return;}
  }
  if(m.world||m.enc){
    if(G.encCool>0){G.encCool--;return;}
    const p=m.world?(ch==='T'?.11:.07):.085;
    if(Math.random()<p)busyRun(randomBattle);
  }
}
async function enterFeature(ch){
  const f=FEAT[ch],M=MAPS[f.map];G.ret={x:f.x,y:f.y+1};
  sfx('door');await fade(1,250);enterMap(f.map,M.start[0],M.start[1],'up');await fade(0,250);
}
async function leaveMap(){sfx('door');await fade(1,250);enterMap('world',G.ret.x,G.ret.y,'down');await fade(0,250);}
async function warpHome(){
  sfx('run');await fade(1,500);G.ret={x:FEAT.V.x,y:FEAT.V.y+1};enterMap('world',FEAT.V.x,FEAT.V.y+1,'down');await fade(0,500);
}
async function encounterFlash(){
  sfx('enc');ui.fadeCol='#fff';
  for(let i=0;i<3;i++){ui.fade=.85;await sleep(70);ui.fade=0;await sleep(70);}
  ui.fadeCol='#000';
}
function makeFormation(zone){
  const tbl=ZONES[zone],k=weighted(tbl).k,e=ENEMIES[k];
  if(e.metal)return [k];
  const r=Math.random();let n=r<.4?1:r<.78?2:3;
  if(e.hp>=90)n=Math.min(n,2);
  if(G.party.length===1)n=Math.min(n,2);
  const f=[];for(let i=0;i<n;i++)f.push(k);
  if(n>=2&&Math.random()<.3)f[n-1]=weighted(tbl.filter(o=>!ENEMIES[o.k].metal)).k;
  return f;
}
async function randomBattle(){
  const zone=G.map.zone!=null?G.map.zone:zoneAt(G.x,G.y);
  const f=makeFormation(zone);
  await encounterFlash();
  const bg=G.map.world?(tileAt(G.x,G.y)==='T'?'forest':'plain'):(G.map.bgKind||'tower');
  const r=await battle(f,{bg});
  if(r==='lose')await gameOver();
  G.encCool=4;
}
async function interact(fromMenu){
  const [dx,dy]=DIRS[G.dir],fx=G.x+dx,fy=G.y+dy;
  let n=npcAt(fx,fy);
  if(!n&&tileAt(fx,fy)==='=')n=npcAt(fx+dx,fy+dy);
  if(n){if(!n.boss)n.dir=OPP[G.dir];await n.talk(n);return true;}
  const c=chestAt(fx,fy);
  if(c){await openChest(c);return true;}
  if(fromMenu)await say('そのほうこうには だれも いない。');
  return false;
}
function npcTick(dt){
  for(const n of G.npcs){
    if(n.mt<1){n.mt=Math.min(1,n.mt+dt/280);continue;}
    if(n.still||G.busy||(n.hide&&n.hide()))continue;
    n.cd-=dt;if(n.cd>0)continue;n.cd=rnd(900,2600);
    const d=pick(['up','down','left','right']),[dx,dy]=DIRS[d],nx=n.x+dx,ny=n.y+dy;n.dir=d;
    if(Math.abs(nx-n.hx)>2||Math.abs(ny-n.hy)>2)continue;
    if(!passable(nx,ny)||(nx===G.x&&ny===G.y)||G.fol.some(f=>f.x===nx&&f.y===ny)||'ES'.includes(tileAt(nx,ny)))continue;
    n.px=n.x;n.py=n.y;n.x=nx;n.y=ny;n.mt=0;
  }
}
function fieldUpdate(dt){
  npcTick(dt);
  if(G.moving){
    G.mt+=dt/MOVE_MS;
    if(G.mt>=1){G.mt=1;G.moving=false;G.px=G.x;G.py=G.y;for(const f of G.fol){f.px=f.x;f.py=f.y;}arrive();}
  }
  if(G.busy){fieldAction=null;return;}
  if(!G.moving){
    if(fieldAction){
      const a=fieldAction;fieldAction=null;
      if(a==='ok'){busyRun(async()=>{if(!(await interact(false)))await fieldMenu();});return;}
      if(a==='cancel'){busyRun(fieldMenu);return;}
    }
    const d=held[held.length-1];if(d)tryMove(d);
  }
}
function camera(){
  const m=G.map,px=lerp(G.px,G.x,G.mt)*TS,py=lerp(G.py,G.y,G.mt)*TS;
  let cx=px+TS/2-CW/2,cy=py+TS/2-CH/2;const mw=m.w*TS,mh=m.h*TS;
  cx=mw<=CW?-(CW-mw)/2:clamp(cx,0,mw-CW);cy=mh<=CH?-(CH-mh)/2:clamp(cy,0,mh-CH);
  return [Math.round(cx),Math.round(cy)];
}

  const m=G.map,now=performance.now(),[cx,cy]=camera(),fr=Math.floor(now/600)%2,ph=Math.floor(now/220)%2;
  const x0=Math.max(0,Math.floor(cx/TS)),y0=Math.max(0,Math.floor(cy/TS)),x1=Math.min(m.w-1,Math.floor((cx+CW)/TS)),y1=Math.min(m.h-1,Math.floor((cy+CH)/TS));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const ch=m.g[y][x];ctx.drawImage(tileImg(m.theme,ch,ch==='~'?fr:0),x*TS-cx,y*TS-cy);}
  const ents=[];
  for(const c of (m.chests||[]))ents.push({y:c.y*TS,f:()=>chestSprite(ctx,c.x*TS-cx,c.y*TS-cy,!!G.flags[c.flag])});
  for(const n of G.npcs){

async function pickAlly(list,x,y){

async function pickEnemy(B){
  const al=B.enemies.filter(e=>!e.dead);if(al.length===1)return al[0];
  const i=await choose({items:al.map(e=>({label:e.name})),x:8,y:104,onMove:k=>{B.hl=al[k];}});

async function pickSpell(m,B,field){
  const list=spellsOf(m).filter(id=>!field||SPELLS[id].field);if(!list.length)return null;
  for(;;){
    const i=await choose({items:list.map(id=>({label:SPELLS[id].n,sub:String(SPELLS[id].mp),gray:m.mp<SPELLS[id].mp})),x:field?150:8,y:104,title:`${m.name}　MP ${m.mp}`});
    if(i<0)return null;

    if(m.mp<s.mp){sfx('no');continue;}

async function pickItem(battle){
  const ids=Object.keys(G.items).filter(id=>G.items[id]>0&&(!battle||ITEMS[id].kind!=='wing'));
  if(!ids.length)return 'none';
  for(;;){
    const i=await choose({items:ids.map(id=>({label:ITEMS[id].n,sub:'×'+G.items[id]})),x:battle?8:150,y:104,rows:6});

function supportEffect(id,t){
  const s=SPELLS[id];
  if(s.kind==='heal'){
    if(t.hp<=0)return ['しかし こうかが なかった…'];
    const v=Math.min(t.maxhp-t.hp,rnd(s.pow[0],s.pow[1]));t.hp+=v;sfx('heal');t.fl=.5;t.flc='rgba(80,255,120,.45)';
    return [`${t.name}の HPが ${v}ポイント かいふくした!`];
  }
  if(s.kind==='revive'){
    if(t.hp>0)return ['しかし こうかが なかった…'];
    if(Math.random()<.85){t.hp=Math.floor(t.maxhp/2);sfx('heal');t.fl=.6;t.flc='rgba(255,240,120,.5)';return [`なんと ${t.name}が いきかえった!`];}
    return ['しかし ${n}は いきかえらなかった…'.replace('${n}',t.name)];
  }
  return [];
}
async function fieldSpell(){
  const casters=G.party.filter(m=>m.hp>0&&spellsOf(m).some(id=>SPELLS[id].field));
  if(!casters.length){await say('いま つかえる じゅもんは ない。');return;}

}
function itemEffect(id,t){
  const it=ITEMS[id];
  if(t.hp<=0)return ['しかし こうかが なかった…'];
  if(it.kind==='heal'){const v=Math.min(t.maxhp-t.hp,rnd(it.pow[0],it.pow[1]));t.hp+=v;sfx('heal');t.fl=.5;t.flc='rgba(80,255,120,.45)';return [`${t.name}の HPが ${v}ポイント かいふくした!`];}

}
function useUp(id){G.items[id]--;if(G.items[id]<=0)delete G.items[id];}

/* ================= 戦闘 ================= */
function physDmg(atk,def,mult){
  const base=(atk-def/2)*(mult||1);
  if(base<1)return rnd(0,1);
  return Math.max(1,Math.round(base*rnd(88,112)/100));
}
function addFX(k,x,y){if(G.battle&&k)G.battle.fx.push({k,x,y,t:0,d:k==='bolt'?.45:.55});}
async function battle(keys,opt){
  opt=opt||{};
  const B={enemies:[],bg:opt.bg||'plain',boss:!!opt.boss,fx:[],shake:0,active:null,hl:null};
  const n=keys.length,xs=n===1?[352]:n===2?[272,418]:[212,334,454];
  const counts={},idx={};keys.forEach(k=>{counts[k]=(counts[k]||0)+1;});
  keys.forEach((k,i)=>{
    const d=ENEMIES[k],sz=d.size||1;let name=d.n;
    if(counts[k]>1){idx[k]=(idx[k]||0)+1;name+='ABC'[idx[k]-1];}
    B.enemies.push({def:d,k,name,hp:d.hp,maxhp:d.hp,x:xs[i],y:260-46*sz,i,alpha:1,shake:0,flash:0,sleep:false,dead:false});
  });
  G.battle=B;G.scene='battle';closeMsg();ui.msg.on=true;ui.menus.length=0;
  playBGM(opt.bgm||'battle');
  if(opt.intro)for(const l of opt.intro)await bsay(l,900);
  else for(const k of Object.keys(counts))await bsay(counts[k]>1?`${ENEMIES[k].n}が ${counts[k]}ひき あらわれた!`:`${ENEMIES[k].n}が あらわれた!`,450);
  let result=null;
  outer:for(;;){
    const alive=G.party.filter(m=>m.hp>0),cmds=new Map();let i=0;
    while(i<alive.length){
      const c=B.auto?autoCommand(alive[i],B):await commandFor(alive[i],B);
      if(c==='back'){if(i>0)i--;continue;}
      cmds.set(alive[i],c);i++;if(c.t==='run')break;
    }
    B.active=null;
    const runner=[...cmds.entries()].find(([,c])=>c.t==='run');
    if(runner){
      sfx('run');await bsay(`${runner[0].name}たちは にげだした!`,350);
      const pa=alive.reduce((s,m)=>s+agiOf(m),0)/alive.length,live=B.enemies.filter(e=>!e.dead),ea=live.reduce((s,e)=>s+Math.min(e.def.agi,30),0)/live.length;
      if(Math.random()<clamp(.55+(pa-ea)*.03,.3,.9)){await sleep(250);result='run';break;}
      await bsay('しかし まわりこまれて しまった!',600);cmds.clear();
    }
    const acts=[];
    for(const [m,c] of cmds)if(c.t!=='run')acts.push({sp:agiOf(m)*(.6+Math.random()*.6),m,c});
    for(const e of B.enemies)if(!e.dead){const na=e.def.acts2||1;for(let j=0;j<na;j++)acts.push({sp:e.def.agi*(.6+Math.random()*.6)-j*40,e});}
    acts.sort((a,b)=>b.sp-a.sp);
    for(const a of acts){
      if(a.m){if(a.m.hp<=0)continue;B.active=a.m;await partyAct(a.m,a.c,B);B.active=null;}
      else{if(a.e.dead)continue;await enemyAct(a.e,B);}
      if(B.enemies.every(e=>e.dead)){result=B.enemies.some(e=>e.killed)?'win':'fled';break outer;}
      if(G.party.every(m=>m.hp<=0)){result='lose';break outer;}
    }
    G.party.forEach(m=>{m.guard=false;});
  }
  G.party.forEach(m=>{m.guard=false;});
  if(result==='win'){
    const killed=B.enemies.filter(e=>e.killed);
    stopBGM();sfx('win');
    await bsay(B.boss?`${killed[0].name}を たおした!`:'まものたちを やっつけた!',900);
    const exp=killed.reduce((s,e)=>s+e.def.exp,0),gold=killed.reduce((s,e)=>s+e.def.gold,0);
    if(exp>0)await bsay(`けいけんち ${exp}ポイントを かくとく!`,700);
    if(gold>0){G.gold+=gold;await bsay(`${gold}ゴールドを てにいれた!`,700);}
    if(!B.boss&&Math.random()<.08&&(G.items.herb||0)<9){G.items.herb=(G.items.herb||0)+1;await bsay(`${killed[0].def.n}は やくそうを おとしていった!`,700);}
    for(const m of G.party){
      if(m.hp<=0)continue;
      for(const u of gainExp(m,exp)){
        sfx('lvup');await bsay(`${m.name}は レベル${u.lv}に あがった!`,1000);
        await bsay(u.line,800);
        for(const s of u.learn)await bsay(`${m.name}は ${SPELLS[s].n}を おぼえた!`,900);
      }
    }
    ui.msg.wait=true;await waitAction(['ok','cancel']);ui.msg.wait=false;
  }else if(result==='lose'){
    stopBGM();sfx('die');await bsay('ぜんめつ して しまった…',1400);
  }else if(result==='fled'){
    await bsay('まものは どこかへ いってしまった。',700);
  }
  await fade(1,250);
  G.battle=null;closeMsg();
  if(result!=='lose'){G.scene='field';playBGM(G.map.bgm);}
  await fade(0,250);
  return result;
}
async function commandFor(m,B){
  for(;;){
    B.active=m;
    const hasMagic=spellsOf(m).length>0;
    const i=await choose({items:[{label:'たたかう'},{label:m.cls==='warrior'?'とくぎ':'じゅもん',gray:!hasMagic},{label:'ぼうぎょ'},{label:'どうぐ'},{label:'にげる',gray:B.boss},{label:'オート'}],x:8,y:100,w:142,title:m.name});
    if(i===-1)return 'back';
    if(i===0){const t=await pickEnemy(B);if(t)return {t:'atk',target:t};continue;}
    if(i===1){if(!hasMagic){sfx('no');continue;}const c=await pickSpell(m,B,false);if(c)return c;continue;}
    if(i===2)return {t:'guard'};
    if(i===3){const c=await pickItem(true);if(c==='none'){sfx('no');continue;}if(c)return c;continue;}
    if(i===4){if(B.boss){sfx('no');continue;}return {t:'run'};}
    if(i===5){B.auto=true;return autoCommand(m,B);}
  }
}
function autoCommand(m,B){
  const foes=B.enemies.filter(e=>!e.dead);if(!foes.length)return {t:'guard'};
  const reserve=id=>B.boss||m.mp-SPELLS[id].mp>=m.maxmp*.25;
  const can=id=>spellsOf(m).includes(id)&&m.mp>=SPELLS[id].mp;
  const weakest=foes.slice().sort((a,b)=>a.hp-b.hp)[0],biggest=foes.slice().sort((a,b)=>b.hp-a.hp)[0];
  const metal=foes.find(e=>e.def.metal);
  if(m.cls==='hero'){
    const dead=G.party.find(x=>x.hp<=0);if(dead&&can('revive'))return {t:'spell',sp:'revive',target:dead};
    const hurt=G.party.filter(x=>x.hp>0&&x.hp<x.maxhp*.4).sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp)[0];
    if(hurt){if(can('heal2')&&hurt.maxhp-hurt.hp>60)return {t:'spell',sp:'heal2',target:hurt};if(can('heal1'))return {t:'spell',sp:'heal1',target:hurt};}
    if(!metal&&B.boss&&can('bolt')&&m.mp>=m.maxmp*.5)return {t:'spell',sp:'bolt',target:biggest};
  }
  if(m.cls==='mage'){
    if(metal&&can('fire'))return {t:'spell',sp:'fire',target:metal};
    if(foes.length>=2)for(const id of ['blizzard','firestorm'])if(can(id)&&reserve(id))return {t:'spell',sp:id};
    if(biggest.hp>100&&can('inferno')&&reserve('inferno'))return {t:'spell',sp:'inferno',target:biggest};
    if(biggest.hp>15&&can('fire')&&reserve('fire'))return {t:'spell',sp:'fire',target:biggest};
  }
  if(m.cls==='warrior'&&!metal){
    if(foes.length>=2&&can('sweep')&&reserve('sweep'))return {t:'spell',sp:'sweep'};
    if(biggest.hp>100&&can('smash')&&reserve('smash'))return {t:'spell',sp:'smash',target:biggest};
  }
  return {t:'atk',target:metal||weakest};
}
async function damageEnemy(t,d,B){
  sfx('hit');t.hp-=d;t.shake=.3;t.flash=.3;t.sleep=false;
  await bsay(`${t.name}に ${d}ポイントの ダメージ!`,420);
  if(t.hp<=0&&!t.dead){t.dead=true;t.killed=true;t.dying=true;sfx('kill');await bsay(`${t.name}を たおした!`,500);}
}
async function hitEnemyPhys(m,t,mult,B){
  addFX('slash',t.x,t.y);await sleep(120);
  if(t.def.metal){
    const crit=Math.random()<1/10,d=crit?rnd(3,6):rnd(0,1);
    if(crit){sfx('crit');await bsay('かいしんの いちげき!',350);}
    if(d===0){sfx('miss');await bsay(`ミス! ${t.name}に ダメージを あたえられない!`,500);return;}
    await damageEnemy(t,d,B);return;
  }
  if(Math.random()<.03+t.def.agi/600){sfx('miss');await bsay(`${t.name}は ひらりと みをかわした!`,500);return;}
  let d;
  if(mult===1&&Math.random()<(m.cls==='hero'?1/14:1/22)){sfx('crit');B.shake=.25;await bsay('かいしんの いちげき!',350);d=Math.round(atkOf(m)*rnd(95,115)/100);}
  else d=physDmg(atkOf(m),t.def.def,mult);
  if(d===0){sfx('miss');await bsay(`ミス! ${t.name}に ダメージを あたえられない!`,500);return;}
  await damageEnemy(t,d,B);
}
async function partyAct(m,c,B){
  const alive=()=>B.enemies.filter(e=>!e.dead),re=t=>(t&&!t.dead)?t:pick(alive());
  if(c.t==='atk'){const t=re(c.target);if(!t)return;await bsay(`${m.name}の こうげき!`,250);await hitEnemyPhys(m,t,1,B);}
  else if(c.t==='guard'){m.guard=true;await bsay(`${m.name}は みを まもっている。`,450);}
  else if(c.t==='item'){
    if(!G.items[c.id]){await bsay(`${m.name}は どうぐを さがしたが みつからなかった!`);return;}
    useUp(c.id);await bsay(`${m.name}は ${ITEMS[c.id].n}を つかった!`,300);
    for(const l of itemEffect(c.id,c.target))await bsay(l,500);
  }
  else if(c.t==='spell'){
    const s=SPELLS[c.sp];
    if(m.mp<s.mp){await bsay(`${m.name}は ${s.n}を つかおうとした! しかし MPが たりない!`);return;}
    m.mp-=s.mp;
    await bsay(s.skill?`${m.name}の ${s.n}!`:`${m.name}は ${s.n}を となえた!`,300);
    if(s.kind==='dmg'){
      const ts=s.target==='all'?alive():[re(c.target)].filter(Boolean);
      sfx(s.fx||'magic');for(const t of ts)addFX(s.fx,t.x,t.y);if(s.fx==='bolt')B.shake=.3;await sleep(450);
      for(const t of ts){if(t.dead)continue;await damageEnemy(t,rnd(s.pow[0],s.pow[1]),B);}
    }else if(s.kind==='phys'){
      const ts=s.target==='all'?alive():[re(c.target)].filter(Boolean);
      for(const t of ts){if(t.dead)continue;await hitEnemyPhys(m,t,s.mult,B);}
    }else if(s.kind==='sleep'){
      const t=re(c.target);if(!t)return;sfx('magic');addFX('zzz',t.x,t.y-30);await sleep(350);
      if(t.def.boss||Math.random()>.75)await bsay(`しかし ${t.name}には きかなかった!`);
      else{t.sleep=true;await bsay(`${t.name}は ねむって しまった!`);}
    }else{
      for(const l of supportEffect(c.sp,c.target))await bsay(l,500);
    }
  }
}
async function hitParty(e,t,B){
  if(!t)return;
  if(Math.random()<1/24){sfx('miss');await bsay(`ミス! ${t.name}は ひらりと かわした!`,450);return;}
  await dmgParty(t,physDmg(e.def.atk,defOf(t),1),B);
}
async function dmgParty(t,d,B,quick){
  if(t.hp<=0)return;
  if(t.guard)d=Math.floor(d/2);
  if(d<=0){sfx('miss');await bsay(`${t.name}は ダメージを うけない!`,400);return;}
  t.hp=Math.max(0,t.hp-d);sfx('hurt');B.shake=.3;t.fl=.4;t.flc='rgba(255,60,60,.5)';
  await bsay(`${t.name}は ${d}ポイントの ダメージを うけた!`,quick?380:480);
  if(t.hp<=0){sfx('die');await bsay(`${t.name}は ちからつきた…`,700);}
}
async function enemyAct(e,B){
  if(e.sleep){
    if(Math.random()<.35){e.sleep=false;await bsay(`${e.name}は めを さました!`,500);}
    else await bsay(`${e.name}は ねむっている。`,450);
    return;
  }
  if(e.def.flee&&Math.random()<e.def.flee){e.dead=true;e.dying=true;sfx('run');await bsay(`${e.name}は にげだした!`,550);return;}
  const a=weighted(e.def.acts||[{w:1,t:'atk'}]),alive=()=>G.party.filter(m=>m.hp>0),tgt=()=>pick(alive());
  switch(a.t){
    case 'atk':await bsay(`${e.name}の こうげき!`,250);await hitParty(e,tgt(),B);break;
    case 'double':await bsay(`${e.name}は れんぞくで こうげき してきた!`,300);for(let i=0;i<2;i++){const t=tgt();if(!t)break;await hitParty(e,t,B);}break;
    case 'fire':{const t=tgt();await bsay(`${e.name}は ${a.name}を はなった!`,300);sfx(a.fx==='bolt'?'bolt':'fire');B.shake=.3;await sleep(250);await dmgParty(t,rnd(a.pow[0],a.pow[1]),B);break;}
    case 'breath':await bsay(`${e.name}の ${a.name}!`,300);sfx(a.fx==='ice'?'ice':a.fx==='quake'?'hurt':'fire');B.shake=.5;await sleep(300);
      for(const t of alive())await dmgParty(t,rnd(a.pow[0],a.pow[1]),B,true);break;
    case 'say':await bsay(e.name+a.msg,700);break;
  }
}
function drawFX(B){
  for(const f of B.fx){
    const k=f.t/f.d;ctx.save();
    switch(f.k){
      case 'slash':ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.globalAlpha=1-k;const q=Math.min(1,k*2.5);
        ctx.beginPath();ctx.moveTo(f.x-40,f.y-40);ctx.lineTo(f.x-40+80*q,f.y-40+80*q);ctx.stroke();
        ctx.beginPath();ctx.moveTo(f.x+30,f.y-46);ctx.lineTo(f.x+30-70*q,f.y-46+90*q);ctx.stroke();break;
      case 'fire':for(let i=0;i<12;i++){const a=i*.52+f.t*6,r=10+k*38;ctx.fillStyle=i%2?`rgba(255,210,50,${1-k})`:`rgba(255,80,20,${1-k})`;ctx.beginPath();ctx.arc(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r-k*24,14*(1-k)+4,0,7);ctx.fill();}break;
      case 'bolt':{ctx.strokeStyle=`rgba(255,255,150,${1-k})`;ctx.lineWidth=6;ctx.beginPath();let x=f.x,y=0;ctx.moveTo(x,y);while(y<f.y+20){y+=22;x=f.x+rnd(-16,16);ctx.lineTo(x,y);}ctx.stroke();
        if(k<.3){ctx.fillStyle='rgba(255,255,220,.35)';ctx.fillRect(0,0,CW,CH);}break;}
      case 'ice':for(let i=0;i<10;i++){const a=i/10*6.28,r=56*(1-k)+6;ctx.fillStyle=`rgba(190,240,255,${1-k*.7})`;ctx.save();ctx.translate(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r);ctx.rotate(a);ctx.fillRect(-11,-3,22,6);ctx.restore();}break;
      case 'zzz':ctx.globalAlpha=1-k;txt('Z',f.x+k*24,f.y-k*40,'#cfe0ff',26);txt('z',f.x-10+k*14,f.y-k*20,'#cfe0ff',18);break;
    }
    ctx.restore();
  }
}
function drawBattle(){
  const B=G.battle,t=performance.now()/1000;
  ctx.save();if(B.shake>0)ctx.translate(rnd(-5,5),rnd(-4,4));
  ctx.drawImage(getBG(B.bg),0,0);
  for(const e of B.enemies){
    if(e.alpha<=0)continue;
    const sz=e.def.size||1;
    ctx.save();ctx.globalAlpha=e.alpha;
    ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(e.x,e.y+48*sz,40*sz,8*sz,0,0,7);ctx.fill();
    if(e.flash>0&&Math.floor(e.flash*30)%2===0)ctx.filter='brightness(2.8)';
    if(e.dying)ctx.filter='brightness(1.8) saturate(.3)';
    drawEnemy(ctx,e.def,e.x+(e.shake>0?rnd(-5,5):0),e.y+Math.sin(t*2+e.i)*2,t+e.i);
    ctx.restore();
    if(e.sleep&&!e.dead)txt('Zz',e.x+30*sz,e.y-40*sz+Math.sin(t*3)*4,'#d8e8ff',18);
  }
  drawFX(B);
  if(B.auto){win(CW-196,8,188,44);txt('オート中 X:とめる',CW-102,30,'#ffe28a',16,'center');}
  ctx.restore();
  drawParty(8,8);
}

async function inn(price){
  ui.gold=true;
  await say(`たびびとの やどへ ようこそ。 ひとばん ${price}ゴールドですが おとまりに なりますか?`);
  const a=await yesno();
  if(a!==0){await say('またの おこしを おまちして おります。');return;}
  if(G.gold<price){sfx('no');await say('おや? おかねが たりない ようですね。');return;}
  G.gold-=price;closeMsg();stopBGM();await fade(1,600);sfx('inn');
  G.party.forEach(m=>{if(m.hp>0){m.hp=m.maxhp;m.mp=m.maxmp;}});
  await sleep(1600);playBGM(G.map.bgm);await fade(0,600);
  await say('おはよう ございます。 ゆうべは よく おやすみ でしたね。\nいってらっしゃいませ!');
  if(G.party.some(m=>m.hp<=0))await say('…しんで しまった なかまは ルーンじょうの きょうかいで いきかえらせて もらうと いいですよ。');
}
async function shop(stock){
  ui.gold=true;
  await say('いらっしゃいませ! ここは ぶきと どうぐの みせ です。');
  for(;;){
    note('なにを なさいますか?');
    const k=await choose({items:[{label:'かう'},{label:'うる'},{label:'やめる'}],x:8,y:8,w:132});
    if(k<0||k===2){await say('また どうぞ!');return;}
    if(k===0)await shopBuy(stock);else await shopSell();
  }
}
function equipDesc(id){
  const eq=EQUIP[id],who=G.party.filter(m=>canEquip(m,id)).map(m=>m.name);
  return `${eq.t==='w'?'こうげき':'しゅび'}+${eq.v}　そうび：${who.length?who.join(' '):'いまの なかまは できない'}`;
}
async function shopBuy(stock){
  let cur=0;
  for(;;){
    const i=await choose({items:stock.map(id=>({label:nameOf(id),sub:priceOf(id)+'G'})),x:8,y:8,rows:8,cursor:cur,
      onMove:k=>note(ITEMS[stock[k]]?ITEMS[stock[k]].desc:equipDesc(stock[k]))});
    if(i<0)return;
    cur=i;const id=stock[i],price=priceOf(id);
    if(G.gold<price){sfx('no');await say('おかねが たりない ようですね。');continue;}
    if(ITEMS[id]){
      if((G.items[id]||0)>=9){await say('それいじょうは もてませんよ。');continue;}
      G.gold-=price;G.items[id]=(G.items[id]||0)+1;sfx('buy');await say(`${ITEMS[id].n}ですね。 まいど ありがとう ございます!`);continue;
    }
    const eq=EQUIP[id],who=G.party.filter(m=>canEquip(m,id));
    if(!who.length){await say('それを そうび できる なかまが いない ようですね。');continue;}
    note(`${eq.n}は ${price}ゴールド です。 どなたが そうび しますか?`);
    const slot=eq.t==='w'?'weapon':'armor';
    const j=await choose({items:who.map(m=>{const df=eq.v-EQUIP[m[slot]].v;return {label:m.name,sub:(df>=0?'+':'')+df};}),x:316,y:60});
    if(j<0)continue;
    const m=who[j],old=EQUIP[m[slot]];
    if(m[slot]===id){await say('それは もう そうび して いますよ。');continue;}
    const back=Math.floor((old.price||0)/2);
    G.gold+=back-price;m[slot]=id;sfx('buy');
    await say(`${m.name}は ${eq.n}を そうびした!\nふるい ${old.n}は ${back}ゴールドで ひきとりました。`);
  }
}
async function shopSell(){
  for(;;){
    const ids=Object.keys(G.items).filter(id=>G.items[id]>0);
    if(!ids.length){await say('うれる ものを もって いない ようですね。');return;}
    note('どれを うって くださるので?');
    const i=await choose({items:ids.map(id=>({label:ITEMS[id].n,sub:Math.floor(ITEMS[id].price/2)+'G'})),x:8,y:8,rows:8});
    if(i<0)return;
    const id=ids[i],v=Math.floor(ITEMS[id].price/2);
    await say(`${ITEMS[id].n}なら ${v}ゴールドで ひきとりましょう。 よろしいですか?`);
    if(await yesno()===0){useUp(id);G.gold+=v;sfx('buy');await say('まいど ありがとう ございます!');}
  }
}
async function priest(){
  await say('かみの みもとへ ようこそ。 どのような ごようですか?');
  for(;;){
    note('どのような ごようですか?');
    const i=await choose({items:[{label:'ぼうけんのしょに きろく'},{label:'なかまを いきかえらせる'},{label:'やめる'}],x:8,y:8});
    if(i<0||i===2){await say('あなたに かみの ごかごが ありますように。');return;}
    if(i===0){
      if(saveGame()){sfx('chest');await say('かみよ この ものたちの ぼうけんを きろく したまえ…\nぼうけんのしょに きろく しました!');}
      else await say('…きろく できなかった ようです。');

      const dead=G.party.filter(m=>m.hp<=0);
      if(!dead.length){await say('いきかえらせる ひつようの ある かたは いない ようです。');continue;}
      const m=dead.length===1?dead[0]:await pickAlly(dead,240,60);if(!m)continue;
      const cost=m.lv*12;ui.gold=true;
      await say(`${m.name}を いきかえらせるには ${cost}ゴールドの きふが ひつようです。 よろしいですか?`);
      const a=await yesno();ui.gold=false;
      if(a!==0)continue;
      if(G.gold<cost){sfx('no');await say('おかねが たりない ようです…');continue;}
      G.gold-=cost;m.hp=m.maxhp;sfx('heal');await say(`かみよ! この ものに いのちを!\n…${m.name}は いきかえった!`);
    }
  }
}

async function openChest(c){

    closeMsg();
    const r=await battle(['golem'],{boss:true,bg:'shrine',bgm:'boss'});
    if(r==='lose'){await gameOver();return;}
    if(r!=='win')return;
    FL()[c.guard]=true;
  }
  sfx('chest');FL()[c.flag]=true;
  const h=G.party[0];
  if(c.gold){G.gold+=c.gold;await say(`たからばこを あけた!\n${c.gold}ゴールドを てにいれた!`);}
  else if(c.item){G.items[c.item]=Math.min(9,(G.items[c.item]||0)+(c.n||1));await say(`たからばこを あけた!\n${ITEMS[c.item].n}を ${c.n||1}こ てにいれた!`);}

}

/* ================= セーブ ================= */
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,
      party:G.party.map(m=>({id:m.id,name:m.name,cls:m.cls,lv:m.lv,exp:m.exp,hp:m.hp,mp:m.mp,weapon:m.weapon,armor:m.armor})),
      gold:G.gold,items:G.items,flags:G.flags,mapId:G.mapId,x:G.x,y:G.y,dir:G.dir,ret:G.ret}));
    return true;
  }catch(e){return false;}
}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function loadGame(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(!d)return false;
    G.party=d.party.map(p=>{const m=Object.assign({fl:0},p);recalc(m);return m;});
    G.gold=d.gold;G.items=d.items||{};G.flags=d.flags||{};G.ret=d.ret||{x:FEAT.V.x,y:FEAT.V.y+1};
    enterMap(d.mapId,d.x,d.y,d.dir);return true;
  }catch(e){return false;}
}

/* ================= タイトル ================= */
const STARS=Array.from({length:90},(_,i)=>({x:(i*97.3)%CW,y:(i*53.7)%300,s:(i%3)+1,p:i*.7}));
function drawSky(t){
  const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#02021a');g.addColorStop(.6,'#1a1450');g.addColorStop(1,'#3a1a5a');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  for(const s of STARS){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.3+s.p));ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.s,s.s);}
  ctx.globalAlpha=1;
  ctx.fillStyle='#0a0820';ctx.beginPath();ctx.moveTo(0,CH);
  for(let x=0;x<=CW;x+=16)ctx.lineTo(x,370-Math.abs(Math.sin(x*.011))*60-Math.sin(x*.04)*8);
  ctx.lineTo(CW,CH);ctx.closePath();ctx.fill();
}
function drawTitle(){
  const t=performance.now()/1000;drawSky(t);
  ctx.fillStyle='#060414';
  ctx.fillRect(330,250,90,110);for(const x of [330,352,374,396])ctx.fillRect(x,240,14,12);
  ctx.fillRect(310,220,26,140);ctx.fillRect(414,220,26,140);
  ctx.beginPath();ctx.moveTo(306,222);ctx.lineTo(323,180);ctx.lineTo(340,222);ctx.fill();
  ctx.beginPath();ctx.moveTo(410,222);ctx.lineTo(427,180);ctx.lineTo(444,222);ctx.fill();
  ctx.fillStyle='#ffd27a';ctx.fillRect(366,280,8,12);ctx.fillRect(320,240,5,7);
  const glow=.6+Math.sin(t*2)*.2;
  ctx.save();ctx.shadowColor=`rgba(255,200,80,${glow})`;ctx.shadowBlur=24;
  txt('ルーン・サーガ',CW/2,110,'#ffe28a',50,'center');ctx.restore();
  txt('― ひかりの ゆうしゃ ―',CW/2,166,'#cfd3ff',22,'center');
  txt('© 2026 ひろ事務所',CW/2,CH-16,'#6a6aa8',13,'center');
}

/* ================= メインループ ================= */
function update(dt,raw){
  tickTyping(Math.min(raw,1000));
  const s=dt/1000;
  for(const m of G.party)if(m.fl>0)m.fl-=s;
  if(G.battle){
    const B=G.battle;if(B.shake>0)B.shake-=s;
    for(const e of B.enemies){if(e.shake>0)e.shake-=s;if(e.flash>0)e.flash-=s;if(e.dying&&e.alpha>0)e.alpha=Math.max(0,e.alpha-s*2.2);}
    B.fx=B.fx.filter(f=>(f.t+=s)<f.d);
  }
  if(G.scene==='field')fieldUpdate(dt);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
  if(G.scene==='title')drawTitle();
  else if(G.scene==='field'&&G.map)drawField();
  else if(G.scene==='battle'&&G.battle)drawBattle();
  else if(G.scene==='ending')drawEnding();
  if(ui.party&&G.scene==='field')drawParty(150,8);
  if(ui.gold){const s=G.gold+' G';win(CW-152,8,144,44);txt(s,CW-26,30,'#fff',20,'right');}
  if(ui.page)drawPage(ui.page);
  ui.menus.forEach((m,i)=>drawMenu(m,i===ui.menus.length-1));
  if(G.battle&&G.battle.hl&&G.scene==='battle'){const e=G.battle.hl,sz=e.def.size||1;txt('▼',e.x,Math.max(14,e.y-58*sz-8)+Math.sin(performance.now()/125)*3,'#ffe28a',24,'center');}
  drawMsg();
  const now=performance.now();
  if(ui.banner&&now<ui.banner.until&&G.scene!=='battle'){
    const a=Math.min(1,(ui.banner.until-now)/400);ctx.globalAlpha=a;
    const w=tw(ui.banner.t,20)+48;win(CW/2-w/2,16,w,42);txt(ui.banner.t,CW/2,37,'#ffe28a',20,'center');ctx.globalAlpha=1;
  }
  if(ui.fade>0){ctx.globalAlpha=Math.min(1,ui.fade);ctx.fillStyle=ui.fadeCol;ctx.fillRect(0,0,CW,CH);ctx.globalAlpha=1;}
}
let last=performance.now();
function frame(now){
  const raw=now-last,dt=Math.min(50,raw);last=now;
  try{update(dt,raw);render();}catch(e){console.error(e);}
  requestAnimationFrame(frame);
}

function askName(){
  return new Promise(res=>{
    const box=document.getElementById('nameBox'),inp=document.getElementById('nameIn'),ok=document.getElementById('nameOk');
    box.style.display='block';setTimeout(()=>{inp.focus();inp.select();},60);
    const done=()=>{const v=(inp.value||'').trim().slice(0,5)||'ゆうしゃ';box.style.display='none';inp.blur();ok.onclick=null;inp.onkeydown=null;res(v);};
    ok.onclick=done;
    inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'&&!e.isComposing){e.preventDefault();done();}};
  });
}
async function newGame(){
  const name=await askName();
  G.party=[newMember('hero',name,'hero',1)];G.gold=50;G.items={herb:2};G.flags={};G.ret={x:FEAT.V.x,y:FEAT.V.y+1};
  await fade(1,500);
  G.scene='intro';stopBGM();
  await fade(0,10);
  ui.fade=0;
  await say('むかし むかし。 ルーンおうこくは 「ひかりのたま」の ちからで へいわに さかえて いた。');
  await say('しかし ある よる まおう ゼルドラが あらわれ ひかりのたまを うばい さった…');
  await say(`そして ここ アルトのむらで ひとりの わかもの ${name}が たびだちの ときを むかえようと していた。`);
  closeMsg();await fade(1,400);
  enterMap('village',4,12,'up');
  await fade(0,600);
  await busyRun(elderTalk);
}
async function titleFlow(){
  G.scene='title';G.busy=true;playBGM('title');
  for(;;){
    const sv=hasSave();
    const i=await choose({items:[{label:'はじめから'},{label:'つづきから',gray:!sv}],x:CW/2-80,y:236,w:160,cancel:false});
    initAudio();
    if(i===0){await newGame();return;}
    if(i===1){
      if(!sv){sfx('no');continue;}
      await fade(1,400);
      if(loadGame()){await fade(0,400);G.busy=false;return;}
      await fade(0,200);await say('ぼうけんのしょが よみこめなかった…');closeMsg();
    }
  }
}
window.RS={G,MAPS,ENEMIES,battle,enterMap,newMember,saveGame,gainExp,ui,tick:(n,dt)=>{for(let i=0;i<n;i++)update(dt||16,dt||16);render();}};
requestAnimationFrame(frame);
(async()=>{
  try{await Promise.race([document.fonts.load('20px "DotGothic16"'),sleep(2500)]);}catch(e){}
  await titleFlow();
})();
})();
